version: "2"
run:
  go: "1.27"
  allow-parallel-runners: true
linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    staticcheck:
      # The staticcheck and gosimple checks run by golangci-lint v1.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        text: 'G306:'
      - linters:
          - gosec
        text: 'G204:'
      - linters:
          - gosec
        text: 'G112:'
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
