apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: without-sub
spec:
  destination:
    namespace: default
  source:
    path: charts/optional-sub
    helm:
      values: |
        sub:
          enabled: false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: with-sub
spec:
  destination:
    namespace: default
  source:
    path: charts/optional-sub
    helm: {}
